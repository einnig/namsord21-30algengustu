<!DOCTYPE html>
<html lang="is">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Námsorð: 21 - 30 algengustu.</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            text-align: center; 
            background-color: #f0f4f8; 
            margin: 0;
            padding: 2vh 5vw; 
            min-height: 95vh; 
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
        }
        .container { 
            width: 100%; 
            max-width: 1200px; 
            background: white; 
            padding: 30px 40px; 
            border-radius: 20px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.1); 
            max-height: 100%;
            overflow-y: auto;
        }
        h1 {
            color: #1a73e8;
            font-size: 2em;
            margin-top: 0;
            margin-bottom: 15px;
        }
        /* Framvindustika */
        .progress-container {
            width: 100%;
            background-color: #e0e0e0;
            border-radius: 10px;
            margin-bottom: 20px;
            height: 20px;
        }
        #progress-bar {
            height: 100%;
            width: 0%;
            background-color: #34a853;
            border-radius: 10px;
            transition: width 0.5s ease-in-out;
        }
        
        #counter { font-size: 1.2em; color: #666; font-weight: bold; margin-bottom: 10px; }

        .lang-selector {
            margin-bottom: 20px;
            background: #fff3e0;
            padding: 10px 15px;
            border-radius: 10px;
            display: inline-block;
            border: 1px solid #ffcc80;
        }

        .lang-selector select {
            padding: 8px;
            font-size: 1.1em;
            border-radius: 5px;
            border: 1px solid #ccc;
            cursor: pointer;
            margin-left: 10px;
            max-width: 300px;
        }
        
        #target { 
            font-size: 4em; 
            margin: 10px 0; 
            color: #222; 
            font-weight: bold;
        }
        
        #is-explanation {
            font-size: 1.2em;
            color: #333;
            background-color: #e8f0fe;
            padding: 15px 25px;
            border-radius: 10px;
            display: inline-block;
            margin-bottom: 20px;
            max-width: 85%;
            line-height: 1.6;
            text-align: left;
        }

        .btn { 
            padding: 12px 25px; 
            font-size: 1.2em; 
            margin: 5px; 
            cursor: pointer; 
            border: none; 
            border-radius: 8px; 
            background-color: #1a73e8; 
            color: white; 
            transition: 0.3s; 
            font-weight: bold;
        }
        .btn:hover:not(:disabled) { background-color: #1557b0; transform: scale(1.02); }
        .recording { background-color: #d93025; animation: pulse 1.5s infinite; }
        .recording:hover { background-color: #b3140b; }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        #media-box { 
            font-size: 1.1em; 
            color: #444; 
            text-align: left; 
            background: #f8fbff; 
            padding: 15px 30px; 
            border-radius: 12px; 
            line-height: 1.6; 
            border-left: 6px solid #1a73e8; 
            margin-top: 15px;
            display: inline-block;
            min-width: 75%;
        }
        #spoken {
            margin-top: 15px; 
            font-size: 1.4em;
            font-style: italic; 
            color: #555;
        }
        #result {
            font-weight: bold; 
            font-size: 1.8em; 
            margin-top: 5px; 
            color: #1a73e8;
        }
        .nav-btns { margin-top: 20px; }
        
        /* Fyrir nafnainnslátt */
        #studentName {
            font-size: 1.5em;
            padding: 10px;
            margin: 20px 0;
            width: 80%;
            max-width: 400px;
            border: 2px solid #1a73e8;
            border-radius: 8px;
            text-align: center;
        }

        .feedback-note {
            margin-top: 40px;
            font-size: 0.95em;
            color: #555;
            padding-top: 15px;
            border-top: 1px solid #ddd;
        }
        .feedback-note a {
            color: #1a73e8;
            text-decoration: none;
            font-weight: bold;
        }
        .feedback-note a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="container" id="app">
    <h1>Námsorð: 21 - 30 algengustu.</h1>
    
    <div class="progress-container">
        <div id="progress-bar"></div>
    </div>

    <div class="lang-selector">
        <label for="languageSelect"><b>🌍 Veldu tungumál:</b></label>
        <select id="languageSelect" onchange="updateUI()">
            <option value="ar">Arabíska – العربية</option>
            <option value="da">Danska – Dansk</option>
            <option value="en" selected>Enska – English</option>
            <option value="tl">Filippseyska – Tagalog / Filipino</option>
            <option value="fr">Franska – Français</option>
            <option value="zh">Kínverska – 中文</option>
            <option value="lv">Lettneska – Latviešu</option>
            <option value="lt">Litháíska – Lietuvių</option>
            <option value="no">Norska – Norsk</option>
            <option value="fa">Persneska – فارسی</option>
            <option value="pt">Portúgalska – Português</option>
            <option value="pl">Pólska – Polski</option>
            <option value="ro">Rúmenska – Română</option>
            <option value="ru">Rússneska – Русский</option>
            <option value="es">Spænska – Español</option>
            <option value="sv">Sænska – Svenska</option>
            <option value="th">Tælenska – ภาษาไทย</option>
            <option value="uk">Úkraínska – Українська</option>
            <option value="vi">Víetnamska – Tiếng Việt</option>
            <option value="de">Þýska – Deutsch</option>
        </select>
    </div>

    <div id="counter"></div>
    
    <div id="target"></div>
    <div id="is-explanation"></div>
    <br>
    <button id="record-btn" class="btn" onclick="toggleRecord()">🎤 Tala</button>
    
    <div id="spoken"></div>
    <div id="result"></div>

    <div id="media-box"></div>

    <div class="nav-btns">
        <button class="btn" style="background-color: #5f6368;" onclick="prevExercise()">⬅️ Fyrri</button>
        <button class="btn" style="background-color: #5f6368;" onclick="nextExercise()">Næsta ➡️</button>
    </div>

    <div class="feedback-note">
        Vinsamlegast sendið ábendingar á <a href="mailto:dgu@fb.is">dgu@fb.is</a>
    </div>
</div>

<script>
const exerciseData = [
    { 
        text: "er", 
        is_exp: "<b>Útskýring:</b> Oftast er þetta <i>sagnorð</i> (nútíð af „að vera“). Það getur líka verið <i>atviksorð eða tengiorð</i> og þýðir þá „þegar“ eða „sem“. (Bókstafur: a).<br><br><b>Samheiti:</b> vera, þegar, sem.<br><br><b>1. Merking (Sagnorð/vera):</b> Hann <b>er</b> glaður.<br><b>2. Merking (Atviksorð/þegar):</b> Ég var úti, <b>er</b> rigningin byrjaði.",
        translations: {
            "ar": "<div dir='rtl' style='text-align: right;'><b>Arabíska (العربية):</b><br><br><b>الشرح:</b> غالباً ما يكون فعلاً (يكون). ويمكن أن يكون ظرفاً أو رابطاً (عندما).<br><br><b>مرادف:</b> يكون، عندما، الذي.<br><br><b>1. المعنى (فعل):</b> هو <b>يكون</b> سعيداً.<br><b>2. المعنى (عندما):</b> كنت بالخارج <b>عندما</b> بدأ المطر.</div>",
            "da": "<b>Danska (Dansk):</b><br><br><b>Forklaring:</b> Oftest et udsagnsord (at være). Kan også være et biord eller bindeord (da/når).<br><br><b>Synonym:</b> være, da, når.<br><br><b>1. Betydning (Udsagnsord/er):</b> Han <b>er</b> glad.<br><b>2. Betydning (Bindeord/da):</b> Jeg var ude, <b>da</b> regnen begyndte.",
            "en": "<b>Enska (English):</b><br><br><b>Explanation:</b> Most often a verb (is/am/are). It can also be an adverb or conjunction meaning 'when' or 'as'.<br><br><b>Synonym:</b> to be, when, as.<br><br><b>1. Meaning (Verb/is):</b> He <b>is</b> happy.<br><b>2. Meaning (Conjunction/when):</b> I was outside <b>when</b> the rain started.",
            "tl": "<b>Filippseyska (Tagalog):</b><br><br><b>Paliwanag:</b> Kadalasang pandiwa (ay). Maaari rin itong pang-abay o pangatnig na nangangahulugang 'nang' o 'kailan'.<br><br><b>Kasingkahulugan:</b> ay, nang, kapag.<br><br><b>1. Kahulugan (Pandiwa):</b> Siya <b>ay</b> masaya.<br><b>2. Kahulugan (Nang):</b> Nasa labas ako <b>nang</b> magsimula ang ulan.",
            "fr": "<b>Franska (Français):</b><br><br><b>Explication:</b> Le plus souvent un verbe (être). Peut aussi être un adverbe ou une conjonction (quand/lorsque).<br><br><b>Synonyme:</b> être, quand, lorsque.<br><br><b>1. Sens (Verbe/est):</b> Il <b>est</b> heureux.<br><b>2. Sens (Conjonction/quand):</b> J'étais dehors <b>quand</b> la pluie a commencé.",
            "zh": "<b>Kínverska (中文):</b><br><br><b>解释：</b> 通常是动词（是/在）。也可以是副词或连词（当……的时候）。<br><br><b>同义词：</b> 是，当，那。<br><br><b>1. 含义 (动词/是):</b> 他<b>是</b>快乐的。<br><b>2. 含义 (连词/当):</b> <b>当</b>雨开始下的时候，我在外面。",
            "lv": "<b>Lettneska (Latviešu):</b><br><br><b>Paskaidrojums:</b> Visbiežāk darbības vārds (būt). Tas var būt arī apstākļa vārds vai saiklis (kad/kā).<br><br><b>Sinonīms:</b> būt, kad.<br><br><b>1. Nozīme (Darbības vārds/ir):</b> Viņš <b>ir</b> priecīgs.<br><b>2. Nozīme (Saiklis/kad):</b> Es biju ārā, <b>kad</b> sākās lietus.",
            "lt": "<b>Litháíska (Lietuvių):</b><br><br><b>Paaiškinimas:</b> Dažniausiai veiksmažodis (būti). Tai taip pat gali būti prievezmis ar jungtukas (kai).<br><br><b>Sinonimas:</b> būti, kai.<br><br><b>1. Reikšmė (Veiksmažodis/yra):</b> Jis <b>yra</b> laimingas.<br><b>2. Reikšmė (Jungtukas/kai):</b> Aš buvau lauke, <b>kai</b> prasidėjo lietus.",
            "no": "<b>Norska (Norsk):</b><br><br><b>Forklaring:</b> Oftest et verb (å være). Kan også være et adverb eller en konjunksjon (da/når).<br><br><b>Synonym:</b> være, da, når.<br><br><b>1. Betydning (Verb/er):</b> Han <b>er</b> glad.<br><b>2. Betydning (Konjunksjon/da):</b> Jeg var ute <b>da</b> regnet begynte.",
            "fa": "<div dir='rtl' style='text-align: right;'><b>Persneska (فارسی):</b><br><br><b>توضیح:</b> اغلب فعل (است) است. همچنین می‌تواند قید یا حرف ربط (وقتی که) باشد.<br><br><b>مترادف:</b> بودن، وقتی که، که.<br><br><b>1. معنی (فعل):</b> او خوشحال <b>است</b>.<br><b>2. معنی (حرف ربط/وقتی که):</b> من بیرون بودم، <b>وقتی که</b> باران شروع شد.</div>",
            "pt": "<b>Portúgalska (Português):</b><br><br><b>Explicação:</b> Mais frequentemente um verbo (ser/estar). Também pode ser um advérbio ou conjunção (quando/como).<br><br><b>Sinônimo:</b> ser, quando, que.<br><br><b>1. Significado (Verbo/é):</b> Ele <b>é</b> feliz.<br><b>2. Significado (Conjunção/quando):</b> Eu estava lá fora <b>quando</b> a chuva começou.",
            "pl": "<b>Pólska (Polski):</b><br><br><b>Wyjaśnienie:</b> Najczęściej czasownik (być). Może też być przysłówkiem lub spójnikiem (kiedy/gdy).<br><br><b>Synonim:</b> być, kiedy, gdy.<br><br><b>1. Znaczenie (Czasownik/jest):</b> On <b>jest</b> szczęśliwy.<br><b>2. Znaczenie (Spójnik/gdy):</b> Byłem na zewnątrz, <b>gdy</b> zaczął padać deszcz.",
            "ro": "<b>Rúmenska (Română):</b><br><br><b>Explicație:</b> Cel mai adesea un verb (a fi). Poate fi, de asemenea, un adverb sau conjuncție (când).<br><br><b>Sinonim:</b> a fi, când.<br><br><b>1. Sens (Verb/este):</b> El <b>este</b> fericit.<br><b>2. Sens (Conjuncție/când):</b> Eram afară <b>când</b> a început ploaia.",
            "ru": "<b>Rússneska (Русский):</b><br><br><b>Объяснение:</b> Чаще всего глагол (быть). Также может быть наречием или союзом (когда).<br><br><b>Синоним:</b> быть, когда.<br><br><b>1. Значение (Глагол):</b> Он (<b>есть</b>) счастлив.<br><b>2. Значение (Союз/когда):</b> Я был на улице, <b>когда</b> начался дождь.",
            "es": "<b>Spænska (Español):</b><br><br><b>Explicación:</b> Más a menudo un verbo (ser/estar). También puede ser un adverbio o conjunción (cuando).<br><br><b>Sinónimo:</b> ser, cuando, que.<br><br><b>1. Significado (Verbo/es):</b> Él <b>es</b> feliz.<br><b>2. Significado (Conjunción/cuando):</b> Estaba afuera <b>cuando</b> empezó la lluvia.",
            "sv": "<b>Sænska (Svenska):</b><br><br><b>Förklaring:</b> Oftast ett verb (att vara). Kan också vara ett adverb eller konjunktion (när/då).<br><br><b>Synonym:</b> vara, då, när.<br><br><b>1. Betydelse (Verb/är):</b> Han <b>är</b> glad.<br><b>2. Betydelse (Konjunktion/när):</b> Jag var ute <b>när</b> regnet började.",
            "th": "<b>Tælenska (ภาษาไทย):</b><br><br><b>คำอธิบาย:</b> มักจะเป็นคำกริยา (เป็น/อยู่/คือ) หรืออาจเป็นกริยาวิเศษณ์/คำสันธาน (เมื่อ)<br><br><b>คำพ้องความหมาย:</b> เป็น, เมื่อ, ขณะที่<br><br><b>1. ความหมาย (กริยา/เป็น):</b> เขา<b>เป็น</b>คนมีความสุข<br><b>2. ความหมาย (สันธาน/เมื่อ):</b> ฉันอยู่ข้างนอก<b>เมื่อ</b>ฝนเริ่มตก",
            "uk": "<b>Úkraínska (Українська):</b><br><br><b>Пояснення:</b> Найчастіше дієслово (бути). Також може бути прислівником або сполучником (коли).<br><br><b>Синонім:</b> бути, коли.<br><br><b>1. Значення (Дієслово/є):</b> Він (<b>є</b>) щасливий.<br><b>2. Значення (Сполучник/коли):</b> Я був на вулиці, <b>коли</b> почався дощ.",
            "vi": "<b>Víetnamska (Tiếng Việt):</b><br><br><b>Giải thích:</b> Thường là động từ (thì/là/ở). Nó cũng có thể là trạng từ hoặc liên từ (khi).<br><br><b>Từ đồng nghĩa:</b> là, khi, lúc.<br><br><b>1. Nghĩa (Động từ/là):</b> Anh ấy <b>thì</b> hạnh phúc.<br><b>2. Nghĩa (Liên từ/khi):</b> Tôi đang ở ngoài <b>khi</b> trời bắt đầu mưa.",
            "de": "<b>Þýska (Deutsch):</b><br><br><b>Erklärung:</b> Meistens ein Verb (sein). Kann auch ein Adverb oder eine Konjunktion sein (als/wenn).<br><br><b>Synonym:</b> sein, als, wenn.<br><br><b>1. Bedeutung (Verb/ist):</b> Er <b>ist</b> glücklich.<br><b>2. Bedeutung (Konjunktion/als):</b> Ich war draußen, <b>als</b> der Regen begann."
        }
    },
    { 
        text: "þjóð", 
        is_exp: "<b>Útskýring:</b> <i>Nafnorð (kvenkyn).</i> Hópur fólks sem á sér sameiginlegt tungumál, menningu eða land. (Bókstafur: s = substantiv/nafnorð).<br><br><b>Samheiti:</b> fólk, landsmenn.<br><br><b>Dæmi:</b> Íslendingar eru lítil <b>þjóð</b>.",
        translations: {
            "ar": "<div dir='rtl' style='text-align: right;'><b>Arabíska (العربية):</b><br><br><b>الشرح:</b> اسم (مؤنث) يطلق على مجموعة من الناس يشتركون في لغة أو ثقافة أو بلد.<br><br><b>مرادف:</b> شعب، أمة.<br><br><b>مثال:</b> الآيسلنديون <b>أمة (شعب)</b> صغيرة.</div>",
            "da": "<b>Danska (Dansk):</b><br><br><b>Forklaring:</b> Navneord (hunkøn). En gruppe mennesker, der deler sprog, kultur eller land.<br><br><b>Synonym:</b> folk, nation.<br><br><b>Eksempel:</b> Islændinge er en lille <b>nation (folk)</b>.",
            "en": "<b>Enska (English):</b><br><br><b>Explanation:</b> A noun (feminine) for a group of people who share the same language, culture or country (nation).<br><br><b>Synonym:</b> people, nation.<br><br><b>Example:</b> Icelanders are a small <b>nation</b>.",
            "tl": "<b>Filippseyska (Tagalog):</b><br><br><b>Paliwanag:</b> Pangngalan. Grupo ng mga tao na may iisang wika, kultura o bansa (bansa/nasyon).<br><br><b>Kasingkahulugan:</b> bansa, nasyon, mamamayan.<br><br><b>Halimbawa:</b> Ang mga Icelander ay isang maliit na <b>nasyon</b>.",
            "fr": "<b>Franska (Français):</b><br><br><b>Explication:</b> Nom (féminin). Un groupe de personnes qui partagent une langue, une culture ou un pays.<br><br><b>Synonyme:</b> peuple, nation.<br><br><b>Exemple:</b> Les Islandais sont une petite <b>nation</b>.",
            "zh": "<b>Kínverska (中文):</b><br><br><b>解释：</b> 名词。指拥有共同语言、文化或国家的一群人（民族/国家）。<br><br><b>同义词：</b> 民族，人民，国家。<br><br><b>例句:</b> 冰岛人是一个小<b>民族（国家）</b>。",
            "lv": "<b>Lettneska (Latviešu):</b><br><br><b>Paskaidrojums:</b> Lietvārds. Cilvēku grupa, kam ir kopīga valoda, kultūra vai valsts.<br><br><b>Sinonīms:</b> tauta, nācija.<br><br><b>Piemērs:</b> Islandieši ir maza <b>tauta</b>.",
            "lt": "<b>Litháíska (Lietuvių):</b><br><br><b>Paaiškinimas:</b> Daiktavardis. Žmonių grupė, turinti bendrą kalbą, kultūrą ar šalį.<br><br><b>Sinonimas:</b> tauta, nacija.<br><br><b>Pavyzdys:</b> Islandai yra maža <b>tauta</b>.",
            "no": "<b>Norska (Norsk):</b><br><br><b>Forklaring:</b> Substantiv. En gruppe mennesker som deler språk, kultur eller land.<br><br><b>Synonym:</b> folk, nasjon.<br><br><b>Eksempel:</b> Islendinger er en liten <b>nasjon</b>.",
            "fa": "<div dir='rtl' style='text-align: right;'><b>Persneska (فارسی):</b><br><br><b>توضیح:</b> اسم. گروهی از مردم که دارای زبان، فرهنگ یا کشور مشترک هستند (ملت).<br><br><b>مترادف:</b> مردم، ملت.<br><br><b>مثال:</b> ایسلندی‌ها <b>ملت</b> کوچکی هستند.</div>",
            "pt": "<b>Portúgalska (Português):</b><br><br><b>Explicação:</b> Substantivo. Um grupo de pessoas que partilham a mesma língua, cultura ou país.<br><br><b>Sinônimo:</b> povo, nação.<br><br><b>Exemplo:</b> Os islandeses são uma pequena <b>nação</b>.",

let userScores = new Array(exerciseData.length).fill(null);
let userSpoken = new Array(exerciseData.length).fill("");

let currentIndex = 0;
let recognition;
let isRecording = false;
let autoAdvanceTimer = null;
let hasDownloadedCert = false; 

const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
if (SpeechRecognition) {
    recognition = new SpeechRecognition();
    recognition.lang = 'is-IS';
    recognition.continuous = false;
    recognition.interimResults = false;
    
    recognition.onend = () => {
        isRecording = false;
        const btn = document.getElementById('record-btn');
        if (btn) {
            btn.innerText = "🎤 Tala";
            btn.classList.remove('recording');
        }
        
        const resDiv = document.getElementById('result');
        if (resDiv && resDiv.innerText === "Hlusta...") {
            resDiv.innerText = "";
        }
    };
} else {
    alert("Þessi vafri styður ekki talgreiningu. Notaðu Chrome eða Edge á tölvu.");
}

window.onload = () => { 
    updateUI(); 
};

function updateProgress() {
    let correctCount = 0;
    for (let i = 0; i < userScores.length; i++) {
        if (userScores[i] === 100) {
            correctCount++;
        }
    }
    const percent = (correctCount / exerciseData.length) * 100;
    
    const progressBar = document.getElementById('progress-bar');
    if(progressBar) {
        progressBar.style.width = percent + '%';
    }
    return correctCount;
}

    for (let i = 0; i < userScores.length; i++) {
        if (userScores[i] !== 100) {
            currentIndex = i;

    document.getElementById('app').innerHTML = `

                <div class="progress-container"><div id="progress-bar" style="width: ${(correctCount/exerciseData.length)*100}%;"></div></div>
                <h1 style="color: #fbbc05; font-size: 2em;">Þú ert næstum því búin(n)!</h1>
                <p style="font-size: 1.2em;">Þú hefur klárað ${correctCount} af ${exerciseData.length} orðum með 100% árangri.</p>
                <p style="font-size: 1.1em; color: #555;">Farðu til baka og reyndu aftur við þau orð sem vantaði upp á til að fá skjalið.</p>
                <button class="btn" style="background-color: #fbbc05; color: #000;" onclick="findNextUnfinished()">➡️ Fara á orð sem vantar</button>
                <div class="feedback-note">
                    Vinsamlegast sendið ábendingar á <a href="mailto:dgu@fb.is">dgu@fb.is</a>
                </div>
            `;
        }
        return;
    }

    const curr = exerciseData[currentIndex];
    
    const langSelect = document.getElementById('languageSelect');
    const selectedLang = langSelect ? langSelect.value : 'en';

    document.getElementById('target').innerHTML = curr.text;
    document.getElementById('is-explanation').innerHTML = curr.is_exp;
    document.getElementById('counter').innerText = `Orð ${currentIndex + 1} af ${exerciseData.length}`;
    
    document.getElementById('media-box').innerHTML = curr.translations[selectedLang] || "Þýðing ekki til / Translation missing";

    const savedScore = userScores[currentIndex];
    const savedText = userSpoken[currentIndex];

    if (savedScore !== null) {
        document.getElementById('result').innerText = `Einkunn: ${savedScore}%`;
        document.getElementById('spoken').innerText = `Þú sagðir: "${savedText}"`;
    } else {
        document.getElementById('result').innerText = "";
        document.getElementById('spoken').innerText = "";
    }
}

function nextExercise() {
    currentIndex++;
    updateUI();
}

function prevExercise() {
    if (currentIndex > 0) {
        currentIndex--;
        updateUI();
    }
}

function toggleRecord() {
    if (!recognition) return;

    const btn = document.getElementById('record-btn');
    if (isRecording) {
        recognition.stop();
    } else {
        try {
            recognition.start();
            isRecording = true;
            btn.innerText = "🛑 Hlusta...";
            btn.classList.add('recording');
            document.getElementById('result').innerText = "Hlusta...";
            document.getElementById('spoken').innerText = "";
        } catch(e) {
            console.log("Villa í upptöku: " + e);
        }
    }
}

if (recognition) {
    recognition.onresult = (event) => {
        let spoken = event.results[0][0].transcript;
        spoken = spoken.trim().toLowerCase(); 

        document.getElementById('spoken').innerText = `Þú sagðir: "${spoken}"`;
        
        const targetWord = exerciseData[currentIndex].text.toLowerCase();
        
        let score = (spoken === targetWord) ? 100 : 0;
        
        if (spoken.replace(/[.,/#!$%^&*;:{}=\-_`~()]/g,"").trim() === targetWord) {
            score = 100;
        }
        
        document.getElementById('result').innerText = `Einkunn: ${score}%`;

        userScores[currentIndex] = score;
        userSpoken[currentIndex] = spoken;
        
        updateProgress();

        if (score === 100) {
            autoAdvanceTimer = setTimeout(() => {
                nextExercise();
            }, 1000); 
        }
    };
}

function downloadCert() {
    if (hasDownloadedCert) return; 

    const studentNameInput = document.getElementById('studentName');
    const studentName = studentNameInput ? studentNameInput.value.trim() : "";
    
    if (studentName === "") {
        alert("Vinsamlegast skrifaðu nafnið þitt fyrst!");
        return;
    }

    const canvas = document.createElement('canvas');
    canvas.width = 900;
    canvas.height = 600;
    const ctx = canvas.getContext('2d');
    
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    ctx.strokeStyle = '#1a73e8';
    ctx.lineWidth = 15;
    ctx.strokeRect(20, 20, canvas.width - 40, canvas.height - 40);

    ctx.strokeStyle = '#fbbc05';
    ctx.lineWidth = 5;
    ctx.strokeRect(40, 40, canvas.width - 80, canvas.height - 80);
    
    ctx.fillStyle = '#1a73e8';
    ctx.textAlign = 'center';
    ctx.font = 'bold 50px Arial';
    ctx.fillText('Viðurkenning', canvas.width / 2, 140);
    
    ctx.fillStyle = '#333333';
    ctx.font = '24px Arial';
    ctx.fillText('Þetta skjal staðfestir að', canvas.width / 2, 220);
    
    ctx.fillStyle = '#000000';
    ctx.font = 'bold 45px Arial';
    ctx.fillText(studentName, canvas.width / 2, 290);
    
    ctx.fillStyle = '#333333';
    ctx.font = '24px Arial';
    ctx.fillText('hefur lokið æfingunni með glæsibrag:', canvas.width / 2, 360);

    ctx.fillStyle = '#1a73e8';
    ctx.font = 'bold 26px Arial';
    ctx.fillText('Námsorð: 21 - 30 algengustu.', canvas.width / 2, 420);
    
    ctx.fillStyle = '#34a853';
    ctx.font = 'italic 28px Arial';
    ctx.fillText('Frábær árangur! Haltu áfram að æfa þig.', canvas.width / 2, 490);

    const dateString = new Date().toLocaleDateString('is-IS');
    ctx.fillStyle = '#666666';
    ctx.font = '18px Arial';
    ctx.fillText('Dagsetning: ' + dateString, canvas.width / 2, 540);
    
    const link = document.createElement('a');
    link.download = `Vidurkenning_${studentName.replace(/\s+/g, '_')}.png`;
    link.href = canvas.toDataURL('image/png');
    link.click();
    
    hasDownloadedCert = true;
    const btn = document.getElementById('cert-btn');
    if (btn) {
        btn.disabled = true;
        btn.innerText = "✅ Skjal sótt";
        btn.style.backgroundColor = "#5f6368";
        btn.style.cursor = "not-allowed";
        btn.style.opacity = "0.7";
    }
    if (studentNameInput) {
        studentNameInput.disabled = true;
    }
}
</script>

</html>
